<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Payaso Creativo</title>
  <style>

    body {
      display: flex;
      justify-content: center;
      background-color: #1a1a2e;
    }

    .payaso {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 30px;
    }

    .sombrero {
      width: 0;
      height: 0;
      border-left: 110px solid transparent;
      border-right: 110px solid transparent;
      border-bottom: 170px solid purple;
    }

    .banda {
      width: 260px;
      height: 22px;
      background-color: violet;
    }

    .cabeza {
      width: 260px;
      height: 230px;
      background-color: #fddbb4;
      clip-path: polygon(
        20% 0%, 80% 0%,
        100% 20%, 100% 80%,
        80% 100%, 20% 100%,
        0% 80%, 0% 20%
      );
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    .ojos {
      display: flex;
      gap: 55px;
    }

    .ojo {
      width: 55px;
      height: 55px;
      background-color: black;
      clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
    }

    .nariz {
      width: 40px;
      height: 40px;
      background-color: red;
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    }

    .boca {
      width: 160px;
      height: 32px;
      background-color: darkred;
      clip-path: polygon(
        0% 0%, 25% 100%, 50% 0%,
        75% 100%, 100% 0%,
        100% 100%, 0% 100%
      );
    }

    .volante {
      width: 360px;
      height: 50px;
      background-color: tomato;
      clip-path: polygon(
        0% 50%, 10% 0%, 20% 50%, 30% 0%,
        40% 50%, 50% 0%, 60% 50%, 70% 0%,
        80% 50%, 90% 0%, 100% 50%,
        100% 100%, 0% 100%
      );
    }

    .cuerpo {
      width: 290px;
      height: 240px;
      background-color: gold;
      clip-path: polygon(
        50% 0%, 61% 35%, 98% 35%,
        68% 57%, 79% 91%,
        50% 70%, 21% 91%,
        32% 57%, 2% 35%, 39% 35%
      );
    }

    .piernas {
      display: flex;
      gap: 50px;
    }

    .pierna {
      width: 45px;
      height: 100px;
      background-color: purple;
    }

    .zapatos {
      display: flex;
      gap: 20px;
    }

    .zapato {
      width: 110px;
      height: 30px;
      background-color: purple;
      clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 0% 60%);
    }

  </style>
</head>
<body>

  <div class="payaso">
    <div class="sombrero"></div>
    <div class="banda"></div>
    <div class="cabeza">
      <div class="ojos">
        <div class="ojo"></div>
        <div class="ojo"></div>
      </div>
      <div class="nariz"></div>
      <div class="boca"></div>
    </div>
    <div class="volante"></div>
    <div class="cuerpo"></div>
    <div class="piernas">
      <div class="pierna"></div>
      <div class="pierna"></div>
    </div>
    <div class="zapatos">
      <div class="zapato"></div>
      <div class="zapato"></div>
    </div>
  </div>

</body>
</html>
