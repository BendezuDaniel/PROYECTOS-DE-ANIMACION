<html>
<head>
<title>TURISMO PERÚ</title>
<style>
*{
    padding:0px;
    margin:0px;
}
.contenedor{
    width: 600px;
    height:300px;
    border:1px solid black;
    margin:0 auto;
    position: relative;
    overflow: hidden;
}
.tarjeta1, .tarjeta2, .tarjeta3, .tarjeta4{
    width:200px;
    height:300px;
    position: absolute;
    top: 0px;
    background-size: cover;
    left: -200px; /* todas empiezan fuera a la izquierda */
}
.tarjeta1{
    background-image: url(img/img01.jpg);    
    animation: tarjeta1 1s 1 forwards;
}
.tarjeta2{
    background-image: url(img/img02.jpg);    
    animation: tarjeta2 1s 1 forwards 1s;
}
.tarjeta3{
    background-image: url(img/img03.jpg);    
    animation: tarjeta3 1s 1 forwards 2s;
}


/* ANIMACIONES DE IZQUIERDA A DERECHA */
@keyframes tarjeta1{
    0%  { left: -200px; }
    100%{ left: 0px; }
}
@keyframes tarjeta2{
    0%  { left: -200px; }
    100%{ left: 200px; }
}
@keyframes tarjeta3{
    0%  { left: -200px; }
    100%{ left: 400px; }
}

/* Hover */
.tarjeta1:hover,
.tarjeta2:hover,
.tarjeta3:hover{
    transition: 1s;
    scale: 1.2;
    z-index: 1;
}

</style>
</head>
<body>
<div class="contenedor">
    <div class="tarjeta1"></div>
    <div class="tarjeta2"></div>
    <div class="tarjeta3"></div>    
</div>    
</body>
</html>
